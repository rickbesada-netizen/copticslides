name: Build Coptic Slides Android APK
on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        working-directory: android-app
        run: gradle --no-daemon assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: CopticSlides-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Verify and prepare downloadable APK
        run: |
          test -s android-app/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android-app/app/build/outputs/apk/debug/app-debug.apk
          cp android-app/app/build/outputs/apk/debug/app-debug.apk CopticSlides-Android.apk
      - name: Publish APK as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-build-${{ github.run_number }}" CopticSlides-Android.apk \
            --title "Coptic Slides Android build ${{ github.run_number }}" \
            --notes "Installable Android testing APK. Download CopticSlides-Android.apk from Assets. Website content updates automatically; native app changes require installing a new build." \
            --latest
