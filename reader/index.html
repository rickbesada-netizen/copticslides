<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liturgy Reader</title>
<meta name="description" content="Coptic Orthodox liturgical reader: Agpeya, Psalmody, Liturgies, Holy Pascha and the Feast of the Resurrection in English, Coptic and Arabic with phonetics.">
<meta name="theme-color" content="#2b3d5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="bar" id="bar">
  <button class="ib" id="btnBack" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="bar-title" id="barTitle"><span id="barText">Liturgy Reader</span></div>
  <button class="ib" id="btnToc" aria-label="Contents"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
  <button class="ib" id="btnBookmark" aria-label="Bookmark"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button>
  <button class="ib" id="btnPresent" aria-label="Slide show"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M12 16v4M8 20h8"/></svg></button>
  <button class="ib" id="btnSearch" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg></button>
  <button class="ib" id="btnSettings" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
</header>

<main id="view" tabindex="-1"></main>

<aside class="drawer" id="toc" aria-hidden="true">
  <div class="drawer-head"><span id="tocTitle">Contents</span><button class="ib" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <nav id="tocList"></nav>
</aside>
<aside class="drawer right" id="settings" aria-hidden="true">
  <div class="drawer-head"><span id="setTitle">Settings</span><button class="ib" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div id="setBody"></div>
</aside>
<div class="modal" id="modal" aria-hidden="true"><div class="modal-card" id="modalCard"></div></div>
<div class="scrim" id="scrim"></div>

<div class="present" id="present" aria-hidden="true">
  <div class="present-stage" id="presentStage"></div>
  <div class="present-ui">
    <button id="pPrev" aria-label="Previous">‹</button>
    <span id="pCount"></span>
    <button id="pNext" aria-label="Next">›</button>
    <button id="pFull" class="pfull" aria-label="Full screen">⛶</button>
    <button id="pExit" class="pexit" aria-label="Exit">✕</button>
  </div>
</div>

<script src="js/i18n.js"></script>
<script src="js/translit.js"></script>
<script src="js/calendar.js"></script>
<script src="js/icons.js"></script>
<script src="js/art.js"></script>
<script src="js/app.js"></script>
</body>
</html>
