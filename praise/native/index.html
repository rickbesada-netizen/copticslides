n","category":"Worship songs","native":false},{"id":188,"title":"Yeshua","category":"Worship songs","native":false},{"id":189,"title":"You Are My Hiding Place","category":"Worship songs","native":false},{"id":190,"title":"You Are","category":"Worship songs","native":false},{"id":191,"title":"You Call to Me","category":"Worship songs","native":false},{"id":192,"title":"You Say","category":"Worship songs","native":false},{"id":193,"title":"Your Great Name","category":"Worship songs","native":false},{"id":194,"title":"Your Love O Mary","category":"Coptic & Marian","native":false},{"id":195,"title":"Your Word I Have Hidden","category":"Worship songs","native":false},{"id":196,"title":"You’re the True Shepherd","category":"Worship songs","native":false},{"id":197,"title":"1 Peter 5:8","category":"Scripture & prayers","native":false},{"id":198,"title":"10,000 Reasons (Bless the Lord)","category":"Worship songs","native":false}],originals=[{"title":"Light of the Morning","category":"Original worship","en":["At the opening of the morning, I bring my heart to You.\nThrough the silence and the sunlight, Your mercy makes me new.","When the road is long before me, be the lamp beneath my feet.\nLet my words be filled with kindness; let my work become Your peace.","Glory to the Father, glory to the Son,\nGlory to the Holy Spirit, Three in One."],"ar":["في بداية هذا الصباح، أرفع قلبي إليك.\nوفي الهدوء والنور، رحمتك تجددني.","عندما يطول الطريق أمامي، كن نورًا لخطواتي.\nاملأ كلامي بالمحبة، واجعل عملي سلامًا.","المجد للآب والابن والروح القدس،\nالثالوث القدوس الإله الواحد."],"id":"original-1","native":true},{"title":"A Prayer for Peace","category":"Original worship","en":["Lord of mercy, teach my heart to rest,\nEven when the day is full of noise.","Make me gentle with the weary,\nMake me patient with the weak.\nLet Your peace begin within me,\nAnd be heard in all I speak.","Glory to You in every season,\nHope of all who call Your name."],"ar":["يا رب الرحمة، علّم قلبي أن يستريح،\nحتى وسط ضجيج النهار.","اجعلني رفيقًا بالمتعبين،\nوصبورًا مع الضعفاء.\nليبدأ سلامك في داخلي،\nوليظهر في كل كلمة أقولها.","المجد لك في كل حين،\nيا رجاء كل من يدعو اسمك."],"id":"original-2","native":true},{"title":"At Your Door","category":"Original worship","en":["I come before Your holy door,\nNot carrying a gift of gold;\nI bring a heart that needs Your grace,\nA story only You can hold.","Open my eyes to see the neighbor,\nOpen my hands to share the bread;\nLet every step become thanksgiving,\nAnd every fear be turned to prayer.","O Christ our Savior, hear our prayer;\nRemain beside us everywhere."],"ar":["أتيت إلى بابك المقدس،\nلا أحمل ذهبًا ولا فضة؛\nبل قلبًا يحتاج إلى نعمتك،\nوحكاية تعرفها أنت وحدك.","افتح عيني لأرى القريب،\nوافتح يدي لأشارك الخبز؛\nلتصير خطواتي شكرًا،\nوتتحول مخاوفي إلى صلاة.","يا مسيح مخلصنا، اسمع صلاتنا،\nوكن معنا في كل مكان."],"id":"original-3","native":true},{"title":"Remember Us in Your Kingdom","category":"Original worship","en":["When the evening shadows gather,\nAnd the candles softly shine,\nWe remember all Your goodness,\nAnd we trust Your love divine.","Remember those who have no shelter,\nThose who grieve and those who wait.\nTeach us how to serve each other,\nAnd to meet them at the gate.","Remember us in Your kingdom,\nLord of mercy, Lord of light."],"ar":["عندما يجتمع ظل المساء،\nوتضيء الشموع بهدوء،\nنذكر جميع إحساناتك،\nونثق بمحبتك الإلهية.","اذكر من ليس لهم مأوى،\nوالمحزونين والمنتظرين.\nعلّمنا أن نخدم بعضنا،\nوأن نفتح أبوابنا للجميع.","اذكرنا في ملكوتك،\nيا رب الرحمة والنور."],"id":"original-4","native":true},{"title":"A Heart of Thanksgiving","category":"Original worship","en":["For the breath that wakes the morning,\nFor the hands that help me stand,\nFor the grace I cannot measure,\nI give thanks with open hands.","In the work and in the waiting,\nIn the joy and in the tears,\nKeep my heart awake to mercy,\nGuide my steps through all my years.","Thanks be to You, O Lord of life,\nOur refuge, hope, and peace."],"ar":["من أجل نسمة هذا الصباح،\nومن أجل الأيدي التي تسندني،\nومن أجل نعمة لا أستطيع أن أقيسها،\nأشكرك بقلب مفتوح.","في العمل وفي الانتظار،\nفي الفرح وفي الدموع،\nاجعل قلبي يقظًا للرحمة،\nوارشد خطواتي كل أيامي.","الشكر لك يا رب الحياة،\nيا ملجأنا ورجاءنا وسلامنا."],"id":"original-5","native":true}],entries=[...catalogue,...originals];let current=null,verse=0,lang='en';const list=document.getElementById('list'),stage=document.getElementById('stage');function draw(){const q=document.getElementById('q').value.toLocaleLowerCase(),cat=document.getElementById('category').value;const matched=entries.filter(s=>s.title.toLocaleLowerCase().includes(q)&&(cat==='all'||s.category===cat));document.getElementById('count').textContent=matched.length+' entries';list.replaceChildren();matched.forEach(s=>{const card=document.createElement('article');card.className='song';const h=document.createElement('h3');h.textContent=s.title;const meta=document.createElement('small');meta.textContent=s.category+(s.native?' · Complete original bilingual slides':' · Catalogue entry');const b=document.createElement('button');b.textContent=s.native?'Present full song / عرض':'View catalogue entry';b.onclick=()=>open(s);card.append(h,meta,b);list.append(card)})}function open(s){current=s;verse=0;lang='en';document.getElementById('language').value='en';stage.style.display='flex';render()}function render(){document.getElementById('heading').textContent=current.title;const words=document.getElementById('words');if(current.native){words.textContent=current[lang][verse];words.dir=lang==='ar'?'rtl':'ltr';document.getElementById('counter').textContent='Slide '+(verse+1)+' / '+current[lang].length;document.getElementById('prev').disabled=false;document.getElementById('next').disabled=false;document.getElementById('language').disabled=false}else{words.textContent='Catalogue entry — full lyrics are not included.\n\nCategory: '+current.category+'\n\nOriginal song slides can be opened from the Original worship category.';words.dir='ltr';document.getElementById('counter').textContent='Title '+current.id+' of '+catalogue.length;document.getElementById('prev').disabled=true;document.getElementById('next').disabled=true;document.getElementById('language').disabled=true}}function move(n){if(!current||!current.native)return;verse=(verse+n+current[lang].length)%current[lang].length;render()}document.getElementById('q').oninput=draw;document.getElementById('category').onchange=draw;document.getElementById('close').onclick=()=>{stage.style.display='none';if(document.fullscreenElement)document.exitFullscreen()};document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.getElementById('language').onchange=e=>{lang=e.target.value;verse=0;render()};document.getElementById('fullscreen').onclick=()=>stage.requestFullscreen?.();document.addEventListener('keydown',e=>{if(stage.style.display!=='flex')return;if(e.key==='Escape')document.getElementById('close').click();if(e.key==='ArrowRight'||e.key===' ')move(1);if(e.key==='ArrowLeft')move(-1)});draw();</script></body></html>
