<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal NKJV Library — Coptic Slides</title><style>body{background:#090909;color:#f1d48b;font:18px/1.6 system-ui;margin:0}header{padding:18px 5%;border-bottom:1px solid #554221}a{color:#f1d48b}main{max-width:1100px;margin:auto;padding:26px}button,input{padding:12px;background:#241d12;color:#f1d48b;border:1px solid #725d34;border-radius:7px}iframe{width:100%;height:76vh;border:1px solid #554221;background:white;margin-top:20px}p{color:#c7bba2}</style></head><body><header><a href="/">← Coptic Slides</a> · Personal NKJV Bible</header><main><h1>My NKJV Bible</h1><p>Import your own NKJV Bible PDF once. The file stays on this device, is remembered in this browser, and can be opened without an external Bible API. The Bible is not uploaded to the public site.</p><input type="file" accept=".pdf,application/pdf" id="file"><button id="forget">Remove saved Bible</button><p id="status">Checking saved Bible…</p><iframe id="viewer" title="Your personal NKJV Bible PDF" hidden></iframe></main><script>
const name='coptic-slides-personal-library';function db(){return new Promise((resolve,reject)=>{const q=indexedDB.open(name,1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('documents'))q.result.createObjectStore('documents')};q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
async function operation(mode,action){const d=await db();return new Promise((resolve,reject)=>{const t=d.transaction('documents',mode);const r=action(t.objectStore('documents'));if(r&&r.onsuccess!==undefined){r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)}else{t.oncomplete=()=>resolve();t.onerror=()=>reject(t.error)}t.oncomplete=()=>d.close()})}
let url=null;function show(f){if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);const v=document.getElementById('viewer');v.src=url;v.hidden=false;document.getElementById('status').textContent='NKJV Bible ready — saved privately in this browser.'}
document.getElementById('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{await operation('readwrite',s=>s.put(f,'nkjv-pdf'));show(f)}catch(err){document.getElementById('status').textContent='Unable to save: '+err.message}};
document.getElementById('forget').onclick=async()=>{await operation('readwrite',s=>s.delete('nkjv-pdf'));document.getElementById('viewer').hidden=true;document.getElementById('status').textContent='Saved Bible removed from this browser.'};
operation('readonly',s=>s.get('nkjv-pdf')).then(f=>{if(f)show(f);else document.getElementById('status').textContent='Choose your NKJV PDF once to keep it on this device.'}).catch(e=>document.getElementById('status').textContent=e.message);
</script><script>(async function(){try{const u="/documents/nkjv-bible.pdf";const r=await fetch(u,{method:'HEAD',cache:'no-store'});if(!r.ok||!(r.headers.get('content-type')||'').includes('pdf'))return;const v=document.getElementById("viewer");v.src=u+'#page=1';v.hidden=false;v.style.display='block';const info=document.createElement('p');info.textContent='Hosted library PDF loaded automatically. Available on every device.';info.style.color='#e8c56a';v.insertAdjacentElement('beforebegin',info);document.getElementById('status').textContent='Hosted NKJV Bible ready.'; }catch(e){}})();</script></body></html>
